[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-skill-lint"
version = "0.2.0"
description = "Zero-dependency SKILL.md frontmatter linter. ~310 LOC, 35 tests, stdlib-only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["skill-md", "linter", "frontmatter", "yaml", "agent", "openclaw", "agent-skills", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-skill-lint"
Repository = "https://github.com/hussain-alsaibai/tiny-skill-lint"
Issues = "https://github.com/hussain-alsaibai/tiny-skill-lint/issues"

[project.scripts]
tiny-skill-lint = "tiny_skill_lint:main"

[tool.setuptools]
py-modules = ["tiny_skill_lint"]
